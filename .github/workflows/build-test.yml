name: "Build Test"

on:
  workflow_dispatch:
  push:
    branches:
      - feature-chatgpt-account-postprocessing

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-26-aarch64-apple-darwin-no-bin-v1
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      - name: Disable updater signing
        run: |
          bun -e '
          const path = "src-tauri/tauri.conf.json";
          const config = await Bun.file(path).json();
          config.bundle.createUpdaterArtifacts = false;
          await Bun.write(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build Handy for Apple Silicon
        run: bun tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Upload macOS ARM64 build
        uses: actions/upload-artifact@v7
        with:
          name: Handy-macOS-Apple-Silicon
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
