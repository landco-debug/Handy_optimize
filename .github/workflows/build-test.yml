name: "Build Test"

on:
  workflow_dispatch:
  push:
    branches:
      - feature-chatgpt-account-postprocessing
      - feature/direct-local-llm

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-26-aarch64-apple-darwin-no-bin-v1
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      - name: Disable updater signing
        run: |
          bun -e '
          const path = "src-tauri/tauri.conf.json";
          const config = await Bun.file(path).json();
          config.bundle.createUpdaterArtifacts = false;
          await Bun.write(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build Handy for Apple Silicon
        env:
          HANDY_BUILD_TARGET: aarch64-apple-darwin
        run: bun tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Test deterministic text replacements
        run: cargo test --manifest-path src-tauri/Cargo.toml text_replacements --lib

      - name: Test post-processing hotkey overlap rules
        run: cargo test --manifest-path src-tauri/Cargo.toml hotkey_overlap --lib

      - name: Verify bundled local LLM helper
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d -print -quit)"
          HELPER="$APP/Contents/MacOS/handy-local-llm"
          test -x "$HELPER"
          file "$HELPER" | grep -q 'arm64'
          codesign --verify --deep --strict "$APP"

      - name: Smoke-test local LLM runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d -print -quit)"
          HELPER="$APP/Contents/MacOS/handy-local-llm"
          MODEL="$RUNNER_TEMP/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          curl --fail --location --retry 3 \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true" \
            --output "$MODEL"
          python3 - "$HELPER" "$MODEL" <<'PY'
          import json
          import subprocess
          import sys

          helper, model = sys.argv[1:3]
          request = {
              "model_path": model,
              "system_prompt": (
                  "You are a text post-processing engine. Follow the transformation "
                  "instructions in the user message exactly. Return only the transformed "
                  "text, with no explanation or commentary."
              ),
              "user_content": (
                  "<transcript>\n"
                  "Привет, мир.\n"
                  "</transcript>\n\n"
                  "Translate the transcript into natural English.\n"
                  "Return only the translated text."
              ),
              "force_cpu": False,
          }
          result = subprocess.run(
              [helper],
              input=json.dumps(request).encode(),
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              timeout=60,
              check=False,
          )
          if result.returncode != 0:
              stdout = result.stdout.decode(errors="replace")
              stderr = result.stderr.decode(errors="replace")
              raise SystemExit(
                  f"helper failed ({result.returncode}); stdout={stdout[-2000:]!r}; "
                  f"stderr={stderr[-4000:]!r}"
              )
          payload = json.loads(result.stdout)
          if not payload.get("ok") or not str(payload.get("text", "")).strip():
              raise SystemExit(f"invalid helper response: {payload}")
          text = str(payload["text"]).strip()
          if "привет" in text.lower() or "мир" in text.lower():
              raise SystemExit(f"local LLM did not transform the transcript: {payload}")
          if "hello" not in text.lower() and "world" not in text.lower():
              raise SystemExit(f"unexpected translation smoke-test output: {payload}")
          print("Local LLM translation smoke test:", text[:200])
          PY

      - name: Upload macOS ARM64 build
        uses: actions/upload-artifact@v7
        with:
          name: Handy-macOS-Apple-Silicon
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
