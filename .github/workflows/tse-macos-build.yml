name: Build TSE macOS standalone

on:
  push:
    branches:
      - tse-macos-build-01

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Restore source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          data = """[... ELLIPSIZATION ...]"""
          open('/tmp/tse-source.zip','wb').write(base64.b64decode(data))
          PY
          ditto -x -k /tmp/tse-source.zip "$RUNNER_TEMP/tse-src"
      - name: Build
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tse-src/TSE-macOS"
          chmod +x build.sh
          ./build.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TSE-macOS-arm64
          path: ${{ runner.temp }}/tse-src/TSE-macOS/build/TSE-macOS-arm64.zip
          retention-days: 14
