name: Build TSE macOS standalone

on:
  push:
    branches:
      - tse-macos-build-01

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          cd tse-macos
          chmod +x build.sh
          ./build.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TSE-macOS-arm64
          path: tse-macos/build/TSE-macOS-arm64.zip
          retention-days: 14
